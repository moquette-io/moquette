# SCRAM-SHA-256 users used by the MQTT5 enhanced authentication (authentication method "SCRAM-SHA-256").
#
# Do NOT edit this file by hand to add users: the plaintext password is never stored, only the data
# derived from it. Use the script bin/scram_users.sh, which asks for username and password and
# adds (or replaces) the user in this file.
#
# The file is a list of users, each one with the following fields:
#
#   username        Name the client sends in the SCRAM client-first message. Must be unique in the file.
#   salt            Base64 of the random salt (32 bytes) used to derive the salted password.
#   iterationCount  Number of PBKDF2 (Hi) iterations used to derive the salted password.
#                   RFC 7677 recommends at least 4096, which is the default of scram_users.sh.
#   storedKey       Base64 of StoredKey = H(ClientKey). The server uses it to verify the client proof,
#                   without being able to recover the password.
#   serverKey       Base64 of ServerKey = HMAC(SaltedPassword, "Server Key"). The server uses it to
#                   compute the server signature that proves its identity to the client.
#
# Values can be plain or double quoted. Lines starting with '#' and blank lines are ignored.
# The file is read once, at broker startup: restart the broker to apply changes.
#
# Example (illustrative values, not valid credentials):
#
# - username: "alice"
#   salt: "c2FtcGxlLXNhbHQtMzItYnl0ZXMtbG9uZy4uLi4uLi4="
#   iterationCount: 4096
#   storedKey: "c2FtcGxlLXN0b3JlZC1rZXktMzItYnl0ZXMtLi4uLi4="
#   serverKey: "c2FtcGxlLXNlcnZlci1rZXktMzItYnl0ZXMtLi4uLi4="
